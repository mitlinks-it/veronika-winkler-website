{{- $p := site.Params -}}
<form action="{{ $p.formAction }}" method="POST" class="contact-form" data-contact-form>
  <div class="contact-field">
    <label for="contact-name">Name <span class="optional">(optional)</span></label>
    <input type="text" id="contact-name" name="name" autocomplete="name" aria-describedby="contact-name-hint">
    <small id="contact-name-hint">Auf Wunsch anonym – ein Vorname oder Pseudonym genügt.</small>
  </div>

  <div class="contact-field">
    <label for="contact-email">E-Mail-Adresse</label>
    <input type="email" id="contact-email" name="email" autocomplete="email" required>
  </div>

  <div class="contact-row">
    <div class="contact-field">
      <label for="contact-frist">Gewünschter Termin</label>
      <select id="contact-frist" name="terminfrist">
        {{- range $p.preise.items }}
        <option value="{{ .frist }}">{{ .label }} {{ .highlight }} ({{ .price }} €)</option>
        {{- end }}
      </select>
    </div>
    <div class="contact-field">
      <label for="contact-setting">Gesprächsform</label>
      <select id="contact-setting" name="gespraechsform">
        <option value="egal">Egal</option>
        <option value="online">Online</option>
        <option value="vor-ort">Vor Ort in Chemnitz</option>
      </select>
    </div>
  </div>

  <div class="contact-field">
    <label for="contact-message">Deine Nachricht</label>
    <textarea id="contact-message" name="message" rows="5" required></textarea>
  </div>

  <label class="contact-privacy">
    <input type="checkbox" id="privacy-agreement" name="privacy" required>
    <span>Ich habe die <a href="{{ "/datenschutzerklaerung/" | relURL }}">Datenschutzerklärung</a> gelesen und bin mit der Verarbeitung meiner Angaben zur Bearbeitung meiner Anfrage einverstanden.</span>
  </label>

  <input type="text" name="_honey" class="visually-hidden" tabindex="-1" autocomplete="off" aria-hidden="true">
  <input type="hidden" name="_subject" value="Terminanfrage Krisenintervention">

  <button type="submit" class="btn btn-primary btn-block">{{ partial "icon.html" "calendar" }} Termin anfragen</button>
</form>

<aside class="notice" role="note">
  <strong>In einem akuten Notfall</strong> wähle bitte sofort den Notruf <a href="tel:112">112</a>.
  Die Telefonseelsorge erreichst du rund um die Uhr und kostenfrei unter
  <a href="tel:08001110111">0800 111 0 111</a> oder <a href="tel:08001110222">0800 111 0 222</a>.
</aside>
