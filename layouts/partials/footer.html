<footer class="site-footer">
  <div class="footer-quote">
    <div class="container">
      <img class="footer-seeds" src="{{ "images/samen.svg" | relURL }}" alt="" width="300" height="150">
      <p>{{ site.Params.footer.quote }}</p>
      <svg class="footer-heart" viewBox="0 0 40 36" aria-hidden="true"><path d="M20 33C8 24 3 17 3 11a8 8 0 0 1 17-4 8 8 0 0 1 17 4c0 6-5 13-17 22Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    </div>
  </div>
  <div class="container footer-bottom">
    <p class="footer-contact">
      <a href="mailto:{{ site.Params.email }}">{{ partial "icon.html" "mail" }} {{ site.Params.email }}</a>
      <span>{{ partial "icon.html" "pin" }} Pfarrhübel 41, 09125 Chemnitz</span>
    </p>
    <nav class="footer-links" aria-label="Rechtliches">
      <a href="{{ "/impressum/" | relURL }}">Impressum</a>
      <a href="{{ "/datenschutzerklaerung/" | relURL }}">Datenschutzerklärung</a>
    </nav>
    <div id="wcb" aria-label="Website Carbon Emission" class="carbonbadge wcb-d"></div>
    <script src="https://unpkg.com/website-carbon-badges@1.1.3/b.min.js" defer></script>
  </div>
</footer>
