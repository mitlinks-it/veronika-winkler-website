<header class="site-header" data-header>
  <div class="container header-inner">
    <a class="brand" href="{{ "/" | relURL }}" aria-label="{{ site.Params.brand.name }} – zur Startseite">
      <img class="brand-mark" src="{{ "images/pusteblume.svg" | relURL }}" alt="" width="62" height="80">
      <span class="brand-text">
        <span class="brand-name">{{ site.Params.brand.name }}</span>
        <span class="brand-subtitle">{{ site.Params.brand.subtitle }}</span>
      </span>
    </a>

    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="hauptnavigation" data-nav-toggle>
      <span class="nav-toggle-open">{{ partial "icon.html" "menu" }}</span>
      <span class="nav-toggle-close">{{ partial "icon.html" "x" }}</span>
      <span class="visually-hidden">Menü</span>
    </button>

    <nav id="hauptnavigation" class="site-nav" aria-label="Hauptnavigation" data-nav>
      <ul>
        {{- $current := . }}
        {{- range site.Menus.main }}
        <li><a href="{{ .URL | relURL }}"{{ if $current.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
        {{- end }}
      </ul>
      <a class="btn btn-primary btn-small" href="{{ site.Params.bookingUrl | relURL }}">
        {{ partial "icon.html" "calendar" }} Termin buchen
      </a>
    </nav>
  </div>
</header>
