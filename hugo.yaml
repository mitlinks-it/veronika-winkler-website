  # Hero
  hero:
    enable: true
    intro: "Hallo, ich bin"
    title: "Veronika Winkler"
    subtitle: "Praxis für Psychotherapie"
    content: |-
      Ich wollte schon seitdem ich denken kann als Psychotherapeutin arbeiten, ich hab dieses Ziel immer verfolgt und bin nun super glücklich und dankbar in diesem Beruf arbeiten zu können.
      Mein Ziel war es zu verstehen, warum Menschen gewisse Entscheidungen treffen, worin sie sich unterscheiden und zu lernen, wie ich sie am besten darin unterstützen kann, mit sich selbst zufrieden zu sein und “klar zu kommen”.
      Ich freue mich über jeden Patienten, der sich Herz und Mut fasst, um genug Vertrauen aufzubringen sich mir zu öffnen und diese Reise mit mir zu gehen.
      Ich glaube, es gibt nichts schöneres als mitzuerleben. wie sich gemeinsam alles entwickelt und klärt.
      Ich arbeite überwiegend mit traumatisierten Patienten & Patienten mit Persönlichkeitsstörungen und sehr gern auch mit Paaren.
    image: images/veronika-winkler.webp
    bottomImage:
      enable: true
    # roundImage: true # Make hero image circular | default false
    button:
      enable: true
      name: "Lebenslauf"
      url: "#education"
      download: true
      newPage: false
    socialLinks:
      customIcons:
        - icon: images/wi.png
          url: https://www.therapie.de/profil/veronika.winkler/

  # About
  about:
    enable: true
    title: "Über mich"
    content: |-
      Ich wollte schon seitdem ich denken kann als Psychotherapeutin arbeiten, ich hab dieses Ziel immer verfolgt und bin nun super glücklich und dankbar in diesem Beruf arbeiten zu können.
      Mein Ziel war es zu verstehen, warum Menschen gewisse Entscheidungen treffen, worin sie sich unterscheiden und zu lernen, wie ich sie am besten darin unterstützen kann, mit sich selbst zufrieden zu sein und “klar zu kommen”.
      Ich freue mich über jeden Patienten, der sich Herz und Mut fasst, um genug Vertrauen aufzubringen sich mir zu öffnen und diese Reise mit mir zu gehen.
      Ich glaube, es gibt nichts schöneres als mitzuerleben. wie sich gemeinsam alles entwickelt und klärt.
      Ich arbeite überwiegend mit traumatisierten Patienten & Patienten mit Persönlichkeitsstörungen und sehr gern auch mit Paaren.
    image: "images/veronika-winkler.webp"
    skills:
      enable: true
      title: "Meine Behandlungsschwerpunkte:"
      items:
        - "allg. psych. Problem - Lebensberatung"
        - "Coaching"
        - "Depression"
        - "Notfall - Krise"
        - "Persönlichkeitsstörung"
        - "Sexualität"
        - "Stress - Burnout - Mobbing"
        - "Trauer"
        - "Trauma - Gewalt - Missbrauch"

  # Experience
  experience:
    enable: true
    title: "Angebote"
    items:
      - company: "EMDR"
        jobs:
          - name: "Eye Movement Desensitization and Reprocessing"
            content: "Ich biete Ihnen eine EMDR Behandlung an, die auf Ihre individuellen Bedürfnisse zugeschnitten ist. Gemeinsam erarbeiten wir Strategien, um Ihre Lebensqualität zu verbessern und Ihre Ziele zu erreichen."

      - company: "Online-Beratung"
        jobs:
          - name: "Online-Beratung"
            content: "Ich biete Ihnen eine Online-Beratung an, die auf Ihre individuellen Bedürfnisse zugeschnitten ist. Gemeinsam erarbeiten wir Strategien, um Ihre Lebensqualität zu verbessern und Ihre Ziele zu erreichen."

      - company: "Traumatherapie"
        jobs:
          - name: "Traumatherapie"
            content: "Ich biete Ihnen eine Traumtherapie an, die auf Ihre individuellen Bedürfnisse zugeschnitten ist. Gemeinsam erarbeiten wir Strategien, um Ihre Lebensqualität zu verbessern und Ihre Ziele zu erreichen."

      - company: "Verhaltenstherapie"
        jobs:
          - name: "Verhaltenstherapie"
            content: "Ich biete Ihnen eine Verhaltenstherapie an, die auf Ihre individuellen Bedürfnisse zugeschnitten ist. Gemeinsam erarbeiten wir Strategien, um Ihre Lebensqualität zu verbessern und Ihre Ziele zu erreichen."

  # Education
  education:
    enable: true
    title: "Vita"
    index: false
    items:
      - title: "Schulbildung und Ausbildung"
        date: "bis 2003"
        content: |-
          - Abitur am Goethe Gymnasium Reichenbach.
          - Ausbildung zur Physiotherapeutin am HBK Zwickau (2000 - 2003).

      - title: "Berufliche Tätigkeit als Physiotherapeutin"
        date: "2003 - 2007"
        content: |-
          - Tätigkeit als Physiotherapeutin in Zwickau, Heilbronn und Reichenbach.

      - title: "Studium und akademische Tätigkeit"
        school:
          name: "TU Chemnitz"
        date: "2007 - 2012"
        content: |-
          - Studium der Psychologie.
          - Studentische Hilfskraft an der Professur für Persönlichkeitspsychologie und der Professur für Motivationspsychologie.
          - Mitglied in der Fachgruppe Psychologie.
          - Studentisches Mitglied des Prüfungsausschusses Psychologie (2009 - 2012).
          - Praktikum an der Klinik Carolabad in Chemnitz.
          - Bachelor- und Masterarbeit zur Therapie von Schlafstörungen; spätere Publikation der Ergebnisse.
          - Masterabschluss Psychologie (2012).

      - title: "Weiterbildung und klinisch-psychotherapeutische Tätigkeit"
        date: "2012 - 2021"
        content: |-
          - Weiterbildung zur Psychologischen Psychotherapeutin am ZfP Chemnitz.
          - Praktikum am Klinikum Zschopau (10/2012 - 12/2012).
          - Tätigkeit als Psychologin auf der Akutpsychiatrie am Klinikum Zschopau (2012 - 2015), einschließlich Einsätzen auf der Suchtstation, Tagesklinik, Gerontologie und Onkologie.
          - Psychologin an der Sozialpsychiatrischen Tagesklinik des Klinikum Chemnitz (2017 - 2019).
          - Ambulante psychotherapeutische Tätigkeit am ZfP durchgängig von 2012 - 2021.
          - Elternzeiten 2015 - 2017 und 2019 - 2021.
          - Approbation als Psychologische Psychotherapeutin (09/2021).

      - title: "Psychotherapeutische Tätigkeit und Niederlassung"
        date: "2021 - heute"
        content: |-
          - Psychologische Psychotherapeutin an der PHA TUC Chemnitz (10/2021 - 05/2022).
          - Angestellte Psychotherapeutin (06/2022 - 01/2023).
          - Eigener Kassensitz in Gemeinschaftspraxis in Rabenstein (seit 02/2023).
          - Einzelpraxis am Pfarrhübel 41 (seit 10/2024).

      - title: "Weitere berufliche Tätigkeit"
        school:
          name: "Diskothek EWerk Reichenbach"
        date: "2004 - 2008"
        content: |-
          Tätigkeit als Barkeeperin.

  # Achievements
  achievements:
    enable: true
    title: "Zusatzqualifikationen"
    items:
      - title: EMDR Teil 1
        content: Grundlagen der Anwendung der EMDR Methode Traumaspezifische Diagnostik, Indikationen und Kontraindikationen, die acht Phasen der EMDR-Behandlung sowie das EMDR-Standard-Protokoll
        url: https://www.emdr.de/emdr-seminar-teil-1-buchen
      - title: EMDR Teil 2
        content: Enthält den Umgang mit komplexeren Blockaden im EMDR Prozess, kognitives Einweben, CIPOS und ressourcenzentrierte EMDR-Techniken.
        url: https://www.emdr.de/emdr-seminar-teil-2-buchen
      - title: EMDR Masterclasses
        content: EMDR Masterclasses sind Vertiefungsseminare zu spezifischen Themen
        url: https://www.emdr.de/emdr-masterclasses-buchen
      - title: Fortlaufende Supervision
        content: Wesentliche Inhalte der Supervision sind die Behandlungsplanung sowie der differenzierte Einsatz der verschiedenen EMDR-Techniken.
        url: https://www.emdr.de/supervision


