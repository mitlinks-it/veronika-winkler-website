baseURL: "https://hugo-profile.netlify.app"
locale: "de-DE"
defaultContentLanguage: "de"
title: "Veronika Winkler – Psychologische Psychotherapeutin"

# The site uses its own layouts (layouts/), the hugo-profile theme is no longer used.
disableKinds:
  - taxonomy
  - term

outputs:
  home:
    - "HTML"
  page:
    - "HTML"

enableRobotsTXT: true

markup:
  goldmark:
    renderer:
      unsafe: true

menus:
  main:
    - name: Angebot
      url: /#angebot
      weight: 1
    - name: Über mich
      url: /#ueber-mich
      weight: 2
    - name: Ablauf
      url: /#ablauf
      weight: 3
    - name: Preise
      url: /#preise
      weight: 4
    - name: FAQ
      url: /#faq
      weight: 5
    - name: Kontakt
      url: /kontakt/
      weight: 6

params:
  description: >-
    Krisenintervention bei Veronika Winkler, Psychologische Psychotherapeutin in Chemnitz –
    schnell, flexibel und auf Wunsch anonym. Termine innerhalb von 24 Stunden, 48 Stunden oder 7 Tagen, online oder vor Ort.
  favicon: images/pusteblume.svg
  email: info@psychotherapie-veronika-winkler.de
  bookingUrl: /kontakt/
  # FormSubmit endpoint of the contact form
  formAction: https://formsubmit.co/3be1d9af1658118a20ebc542cfcbadaa

  brand:
    name: Veronika Winkler
    subtitle: Psychologische Psychotherapeutin

  hero:
    title: "Wenn gerade nichts mehr geht …"
    script: "… bin ich für dich da."
    subtitle: "Krisenintervention –"
    subtitleLine2: "schnell, flexibel und auf Wunsch anonym"
    content: >-
      Du musst nicht allein durch eine schwere Zeit gehen.
      Ich begleite dich professionell, einfühlsam und lösungsorientiert –
      kurzfristig, online oder vor Ort.
    image: images/veronika-winkler.webp
    imageAlt: "Porträt von Veronika Winkler"
    badge: "Du musst das nicht alleine schaffen."
    button: "Jetzt Termin buchen"
    highlights:
      - icon: bolt
        text: "Akute Krisenbegleitung"
      - icon: heart
        text: "Unterstützung bei Lebenskrisen & Belastungen"
      - icon: lotus
        text: "EMDR – Traumaverarbeitung"
      - icon: users
        text: "Online oder vor Ort"

  zielgruppen:
    title: "Für wen ist dieses Angebot?"
    items:
      - icon: bolt
        title: "In akuten Krisen"
        text: "z. B. bei Trennung, Verlust, Überforderung oder plötzlichen Veränderungen"
      - icon: users
        title: "Ohne Zugang zur Regelversorgung"
        text: "z. B. bei langen Wartezeiten, fehlender Indikation oder erschöpften Therapiestunden"
      - icon: heart
        title: "Für ehemalige Patienten"
        text: "bei neuen Belastungen oder zur Auffrischung"
      - icon: leaf
        title: "Bei konkreten Anliegen"
        text: "wenn du nicht jahrelang Therapie machen möchtest, sondern ein bestimmtes Thema klären willst"
      - icon: lotus
        title: "Für mehr Lebensqualität"
        text: "wenn du dich wieder stabilisieren und handlungsfähig fühlen möchtest"

  angebot:
    title: "Mein Angebot"
    content: >-
      In einer psychotherapeutischen Krisensprechstunde klären wir gemeinsam deine aktuelle Situation,
      schauen, was dich gerade belastet und welche Möglichkeiten es für dich gibt.
    items:
      - "Professionelle Unterstützung in einer Krise"
      - "EMDR bei Bedarf"
      - "Online oder vor Ort"
      - "Termine auch am Wochenende möglich"
    script: "Du musst das nicht alleine schaffen."

  preise:
    title: "Flexible Termine – faire Preise"
    intro: "Du musst nicht lange warten."
    # `frist` is the value preselected in the contact form (see layouts/shortcodes/contact.html)
    items:
      - label: "Innerhalb von"
        highlight: "7 Tagen"
        price: 100
        frist: "7-tage"
      - label: "Innerhalb von"
        highlight: "48 Stunden"
        price: 125
        frist: "48-stunden"
      - label: "Innerhalb von"
        highlight: "24 Stunden"
        price: 150
        frist: "24-stunden"
    payment: "Sicher & unkompliziert bezahlen"

  ueberMich:
    title: "Über mich"
    content:
      - >-
        Ich bin Veronika Winkler, psychologische Psychotherapeutin mit langjähriger Erfahrung –
        u. a. in der Akutpsychiatrie, Traumatherapie und EMDR.
      - >-
        Mir ist wichtig, dich auf Augenhöhe zu begleiten – mit Fachkompetenz, Herz und Zeit für dein Anliegen.
    button: "Mehr über mich"
    url: /ueber-mich/

  ablauf:
    title: "So läuft es ab"
    subtitle: "Professionelle Unterstützung – genau dann, wenn du sie brauchst."
    steps:
      - title: "Kontakt aufnehmen"
        text: "Schreib mir über das Kontaktformular oder per E-Mail. Ein Vorname oder Pseudonym genügt."
      - title: "Termin vereinbaren"
        text: "Du wählst, wie schnell du einen Termin brauchst – innerhalb von 7 Tagen, 48 Stunden oder 24 Stunden."
      - title: "Gespräch führen"
        text: "Wir sprechen online oder vor Ort in meiner Praxis in Chemnitz über das, was dich gerade belastet."
      - title: "Nächste Schritte"
        text: "Gemeinsam klären wir, was dir jetzt hilft – und ob weitere Termine oder andere Angebote sinnvoll sind."

  faq:
    title: "Häufige Fragen"
    items:
      - question: "Übernimmt die Krankenkasse die Kosten?"
        answer: >-
          Die Krisenintervention ist ein zusätzliches Angebot außerhalb der Regelversorgung und wird privat bezahlt.
          Dafür bekommst du kurzfristig einen Termin – ohne Antrag und ohne Wartezeit.
      - question: "Kann ich anonym bleiben?"
        answer: >-
          Ja. Auf Wunsch genügt ein Vorname oder ein Pseudonym. Für die Terminabsprache brauche ich lediglich eine E-Mail-Adresse.
      - question: "Findet das Gespräch online oder vor Ort statt?"
        answer: >-
          Beides ist möglich. Vor Ort sehen wir uns in meiner Praxis am Pfarrhübel 41 in Chemnitz,
          online per Videogespräch.
      - question: "Wie bezahle ich?"
        answer: "Die Bezahlung erfolgt sicher und unkompliziert per PayPal."
      - question: "Was mache ich in einem akuten Notfall?"
        answer: >-
          Wenn du in akuter Gefahr bist oder daran denkst, dir das Leben zu nehmen, wähle bitte sofort den Notruf <a href="tel:112">112</a>.
          Rund um die Uhr und kostenfrei erreichst du auch die Telefonseelsorge unter
          <a href="tel:08001110111">0800 111 0 111</a> oder <a href="tel:08001110222">0800 111 0 222</a>.

  vorteile:
    - icon: shield
      text: "Diskret & vertraulich"
    - icon: clock
      text: "Kurzfristige Termine"
    - icon: monitor
      text: "Online oder vor Ort"
    - icon: heart
      text: "Einfühlsame & professionelle Begleitung"

  footer:
    quote: "Krisenintervention – ein zusätzliches Angebot, dort, wo das Gesundheitssystem an seine Grenzen kommt."
